<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - FilmyFly</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "{{.firebaseConfig.apiKey}}",
            authDomain: "{{.firebaseConfig.authDomain}}",
            projectId: "{{.firebaseConfig.projectId}}",
            storageBucket: "{{.firebaseConfig.storageBucket}}",
            messagingSenderId: "{{.firebaseConfig.messagingSenderId}}",
            appId: "{{.firebaseConfig.appId}}"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    const errorDiv = document.getElementById('error-message');

                    try {
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Signing in...';
                        errorDiv.style.display = 'none';

                        const userCredential = await signInWithEmailAndPassword(auth, email, password);
                        const idToken = await userCredential.user.getIdToken();

                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = '/admin/login';

                        const tokenInput = document.createElement('input');
                        tokenInput.type = 'hidden';
                        tokenInput.name = 'idToken';
                        tokenInput.value = idToken;

                        form.appendChild(tokenInput);
                        document.body.appendChild(form);
                        form.submit();
                    } catch (error) {
                        console.error('Login error:', error);
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Sign In';
                        errorDiv.textContent = error.message || 'Login failed. Please try again.';
                        errorDiv.style.display = 'block';
                    }
                });
            }
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>🎬 FilmyFly Admin</h1>
        <p class="subtitle">Sign in to access the admin dashboard</p>

        {{if .error}}
        <div class="alert alert-error" style="display:block;">{{.error}}</div>
        {{end}}

        <div id="error-message" class="alert alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit">Sign In</button>
        </form>
    </div>
</body>

</html>
